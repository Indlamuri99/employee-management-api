
name: Employee API CI/CD

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  id-token: write


env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER_NAME: dev-eks
  ECR_REPOSITORY: employee-management-api
  K8S_NAMESPACE: employee-prod
  DEPLOYMENT_NAME: employee-api
  CONTAINER_NAME: employee-api


jobs:

  # ============================================================
  # JOB 1: TERRAFORM INFRASTRUCTURE
  # ============================================================

  infrastructure:

    name: Provision AWS Infrastructure

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Source Code
      - name: Checkout Source Code
        uses: actions/checkout@v4


      # 2. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # 3. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # 4. Terraform Init
      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: |
          terraform init


      # 5. Terraform Format Check
      - name: Terraform Format Check
        working-directory: terraform/environments/dev
        run: |
          terraform fmt -check -recursive


      # 6. Terraform Validate
      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: |
          terraform validate


      # 7. Terraform Plan
      - name: Terraform Plan
        working-directory: terraform/environments/dev
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -out=tfplan


      # 8. Terraform Apply
      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: |
          terraform apply \
            -auto-approve \
            tfplan


  # ============================================================
  # JOB 2: BUILD AND TEST
  # ============================================================

  build-test:

    name: Build and Test Application

    runs-on: ubuntu-latest

    needs:
      - infrastructure

    steps:

      # 1. Checkout Source Code
      - name: Checkout Source Code
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # 3. Maven Build
      - name: Build Application
        run: |
          mvn clean package


      # 4. Unit Testing
      - name: Run Tests
        run: |
          mvn test


      # 5. SonarQube Analysis
      - name: SonarQube Scan
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=employee-api \
            -Dsonar.host.url=${{ secrets.SONAR_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}


  # ============================================================
  # JOB 3: DOCKER BUILD + ECR + EKS DEPLOYMENT
  # ============================================================

  deploy:

    name: Deploy Application to EKS

    runs-on: ubuntu-latest

    needs:
      - build-test

    steps:

      # 1. Checkout Source Code
      - name: Checkout Source Code
        uses: actions/checkout@v4


      # 2. Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # 4. Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .


      # 5. Push Docker Image to ECR
      - name: Push Docker Image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


      # 6. Configure kubectl for EKS
      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}


      # 7. Verify EKS Connection
      - name: Verify EKS Connection
        run: |
          kubectl get nodes


      # 8. Apply Namespace
      - name: Apply Namespace
        run: |
          kubectl apply \
            -f kubernetes/namespace.yml


      # 9. Apply ConfigMap
      - name: Apply ConfigMap
        run: |
          kubectl apply \
            -f kubernetes/configmap.yaml \
            -n ${{ env.K8S_NAMESPACE }}


      # 10. Apply Secret
      - name: Apply Secret
        run: |
          kubectl apply \
            -f kubernetes/secret.yaml \
            -n ${{ env.K8S_NAMESPACE }}


      # 11. Apply Deployment
      - name: Apply Deployment
        run: |
          kubectl apply \
            -f kubernetes/deployment.yaml \
            -n ${{ env.K8S_NAMESPACE }}


      # 12. Apply Service
      - name: Apply Service
        run: |
          kubectl apply \
            -f kubernetes/service.yaml \
            -n ${{ env.K8S_NAMESPACE }}


      # 13. Apply Ingress
      - name: Apply Ingress
        run: |
          kubectl apply \
            -f kubernetes/ingress.yaml \
            -n ${{ env.K8S_NAMESPACE }}


      # 14. Apply HPA
      - name: Apply HPA
        run: |
          kubectl apply \
            -f kubernetes/hpa.yaml \
            -n ${{ env.K8S_NAMESPACE }}


      # 15. Update Deployment with New Image
      - name: Update Employee API Image
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} set image \
            deployment/${{ env.DEPLOYMENT_NAME }} \
            ${{ env.CONTAINER_NAME }}=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


      # 16. Wait for Deployment
      - name: Verify Deployment Rollout
        run: |
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status \
            deployment/${{ env.DEPLOYMENT_NAME }} \
            --timeout=5m


      # 17. Verify Pods
      - name: Verify Pods
        run: |
          kubectl get pods \
            -n ${{ env.K8S_NAMESPACE }}


      # 18. Verify Services
      - name: Verify Services
        run: |
          kubectl get svc \
            -n ${{ env.K8S_NAMESPACE }}

